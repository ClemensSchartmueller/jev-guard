name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm/jev-guard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test launcher
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...
