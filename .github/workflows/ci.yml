name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-build:
    name: Release build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: jev-guard-linux-amd64
          - os: linux
            arch: arm64
            output: jev-guard-linux-arm64
          - os: darwin
            arch: amd64
            output: jev-guard-darwin-amd64
          - os: darwin
            arch: arm64
            output: jev-guard-darwin-arm64
          - os: windows
            arch: amd64
            output: jev-guard-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          # Deliberately uncached: these artifacts should be built from a clean
          # toolchain state, not from a GOCACHE restored from another ref's run.
          # The job is a short cross-compile, so caching would save little.
          cache: false

      - name: Build release binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X jev-guard/pkg/cli.Version=ci -X jev-guard/pkg/cli.Commit=${{ github.sha }} -X 'jev-guard/pkg/cli.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o dist/${{ matrix.output }} .

  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm/jev-guard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test launcher
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
          # setup-go's built-in cache is not used: it also archives GOMODCACHE,
          # and the Go toolchain's telemetry writes read-only files there
          # before the restore, so extraction fails ("File exists") and the
          # cache never hits. The module has no dependencies (no go.sum), so
          # only the build cache below is worth caching.
          cache: false

      - name: Locate Go build cache
        id: go-env
        shell: bash
        run: echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Build cache only. Keyed on runner OS/arch and the resolved Go version;
      # the source hash refreshes the cache as code changes and restore-keys
      # fall back to the nearest older snapshot. GOCACHE is content-addressed,
      # so stale entries are ignored rather than reused incorrectly.
      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-env.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        # -count=1 disables Go test-result caching so a restored GOCACHE only
        # saves compilation; security regression tests always execute.
        run: go test -count=1 -v ./...
