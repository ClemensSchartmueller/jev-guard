name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-build:
    name: Release build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: jev-guard-linux-amd64
          - os: linux
            arch: arm64
            output: jev-guard-linux-arm64
          - os: darwin
            arch: amd64
            output: jev-guard-darwin-amd64
          - os: darwin
            arch: arm64
            output: jev-guard-darwin-arm64
          - os: windows
            arch: amd64
            output: jev-guard-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build release binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X jev-guard/pkg/cli.Version=ci -X jev-guard/pkg/cli.Commit=${{ github.sha }} -X 'jev-guard/pkg/cli.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o dist/${{ matrix.output }} .

  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm/jev-guard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test launcher
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...
