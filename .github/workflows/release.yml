name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: jev-guard-linux-amd64
          - os: linux
            arch: arm64
            output: jev-guard-linux-arm64
          - os: darwin
            arch: amd64
            output: jev-guard-darwin-amd64
          - os: darwin
            arch: arm64
            output: jev-guard-darwin-arm64
          - os: windows
            arch: amd64
            output: jev-guard-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X jev-guard/pkg/cli.Version=${{ github.ref_name }} -X jev-guard/pkg/cli.Commit=${{ github.sha }} -X 'jev-guard/pkg/cli.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o dist/${{ matrix.output }} main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum jev-guard-* > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
