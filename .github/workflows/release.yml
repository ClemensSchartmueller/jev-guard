name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: jev-guard-linux-amd64
          - os: linux
            arch: arm64
            output: jev-guard-linux-arm64
          - os: darwin
            arch: amd64
            output: jev-guard-darwin-amd64
          - os: darwin
            arch: arm64
            output: jev-guard-darwin-arm64
          - os: windows
            arch: amd64
            output: jev-guard-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.output }} main.go

      - name: Generate SHA256 Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.output }} >> checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
